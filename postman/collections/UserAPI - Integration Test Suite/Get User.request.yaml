$kind: http-request
order: 3000
method: GET
url: "{{baseUrl}}/v1/users/:id"
pathVariables:
  - key: id
    value: "{{id}}"
    description: ""
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const jsonData = pm.response.json();

      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response contains correct user id", function () {
          pm.expect(jsonData.id).to.eql(pm.variables.get("id"));
      });
examples: ./.resources/Get User.resources/examples
