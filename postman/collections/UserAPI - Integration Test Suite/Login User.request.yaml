$kind: http-request
order: 2000
method: POST
url: "{{baseUrl}}/v1/users/login"
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "{{username}}",
      "password": "{{password}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const jsonData = pm.response.json();

      pm.variables.set("token", jsonData.token);

      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
examples: ./.resources/Login User.resources/examples
