$kind: http-request
order: 4000
method: PUT
url: "{{baseUrl}}/v1/users/:id"
pathVariables:
  id: "{{id}}"
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "{{username}}",
      "password": "{{password}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
examples: ./.resources/Update User.resources/examples
