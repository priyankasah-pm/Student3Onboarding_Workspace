$kind: http-example
name: 500 Internal Server Error
request:
  url: '{{baseUrl}}/v1/users/:id'
  method: GET
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "message": "An error occurred while retrieving the user"
      }
