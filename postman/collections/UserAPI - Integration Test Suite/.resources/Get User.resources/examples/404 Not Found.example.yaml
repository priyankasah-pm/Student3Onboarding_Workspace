$kind: http-example
name: 404 Not Found
request:
  url: '{{baseUrl}}/v1/users/:id'
  method: GET
response:
  statusCode: 404
  statusText: Not Found
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "message": "User not found"
      }
